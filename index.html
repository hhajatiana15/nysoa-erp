<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NYSOA CONSTRUCT - ERP BTP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=20261025-v4-1">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <!-- Ecran de Connexion avec Logo officiel -->
  <div id="login" class="login-screen">
    <div class="login-card">
      <img src="assets/logo_nysoa_officiel.jpg" alt="Logo NYSOA" class="login-logo">
      <h2>ENTREPRISE NYSOA CONSTRUCT</h2>
      <p>ERP BTP - Authentification &amp; Accès Sécurisé</p>
      <form id="loginForm">
        <label>E-mail<input type="email" id="loginUser" required placeholder="hhajatiana15@gmail.com"></label>
        <label>Mot de passe<input type="password" id="loginPass" required></label>
        <label class="show-password-option"><input type="checkbox" id="showLoginPass"> Afficher le mot de passe</label>
        <button type="submit" class="btn primary full">Se connecter</button>
        <p id="loginMsg" class="error-msg"></p>
</form>
    </div>
  </div>

  <!-- Application Principale -->
  <div id="app" class="app-layout hidden">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-container">
         <img src="assets/logo_nysoa_officiel.jpg" alt="Logo NYSOA" class="header-logo">
          <div class="brand-title">NYSOA <b>CONSTRUCT</b> <small>ERP BTP</small></div>
        </div>
        <select id="globalProjectFilter" onchange="setGlobalProjectContext(this.value)"></select>
      </div>
      <div class="header-right">
        <span id="currentUserLabel">Utilisateur</span>
        <span id="cloudStatus" class="cloud-status">Initialisation…</span>
        <span id="cloudLastSync" class="cloud-time"></span>
        <button id="cloudSyncBtn" class="btn-xs" onclick="cloudSyncNow()" title="Synchroniser">🔄 Sync</button>
        <button id="logoutBtn" class="btn-logout" title="Déconnexion">⏻</button>
      </div>
    </header>

    <div id="adminWorkspaceBar" class="workspace-bar hidden">
      <button class="workspace-tab active" data-workspace="GENERAL">Vue Générale</button>
      <button class="workspace-tab" data-workspace="FINANCE">Finance</button>
      <button class="workspace-tab" data-workspace="TECHNIQUE">Technique</button>
    </div>

    <div class="main-body">
      <aside class="sidebar">
        <nav id="menu"></nav>
      </aside>
      <main id="content" class="content-area"></main>
    </div>

    <footer class="app-footer">
      <span>© 2026 ENTREPRISE NYSOA CONSTRUCT - BTP &amp; Génie Civil</span>
      <div><span id="today"></span> - Exercice <span id="exerciseYear">2026</span></div>
    </footer>
  </div>

  <script src="sw-register.js"></script>
  <script src="app.js?v=20261025-v4-1"></script>
</body>
</html>
