<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan présence · NYSOA CONSTRUCT</title>
  <link rel="stylesheet" href="scan.css">
</head>
<body>
  <main class="card">
    <header><img src="assets/logo_nysoa_construct.png" alt="NYSOA CONSTRUCT"><div><strong>NYSOA CONSTRUCT</strong><small>Scan présence des employés</small></div></header>
    <p id="status" class="status" role="status" aria-live="polite">Connexion au service…</p>
    <form id="login" hidden>
      <label>E-mail du compte scanner<input id="email" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Se connecter</button>
    </form>
    <section id="scanner" hidden>
      <label>Chantier<select id="project" required><option value="">Choisir un chantier</option></select></label>
      <div id="reader" aria-label="Caméra de lecture des badges"></div>
      <button id="start" type="button">Ouvrir la caméra</button>
      <button id="stop" type="button" class="muted" hidden>Arrêter la caméra</button>
      <p id="result" class="result" role="status" aria-live="assertive"></p>
      <p class="hint">Présentez le QR du badge devant la caméra. Premier scan : entrée. Scan suivant : sortie.</p>
      <button id="logout" type="button" class="link">Déconnexion</button>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="scan.js"></script>
</body>
</html>
